name: FPL gameweek review
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh data even if the last gameweek was already reviewed
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fpl-review
  cancel-in-progress: false
jobs:
  review:
    # Hard-zero cost guard: no private repo or larger/self-hosted runner fallback.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FORCE_REFRESH: ${{ inputs.force || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies without caching
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Generate public research and encrypted private report
        env:
          REPORT_ENCRYPTION_KEY: ${{ secrets.REPORT_ENCRYPTION_KEY }}
        shell: bash
        run: |
          if [ "$FORCE_REFRESH" = "true" ]; then
            python -m fpl_planner review --force
          else
            python -m fpl_planner review
          fi
      - name: Commit public data and encrypted reports only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data reports
          if ! git diff --cached --quiet; then
            git commit -m 'data: update numerical gameweek research'
            git push
          fi
